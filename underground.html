<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mind the App</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%23E32017' stroke-width='10'/%3E%3Crect x='6' y='26' width='52' height='12' rx='2' fill='%231E3FD8'/%3E%3C/svg%3E">
<style>
:root{
  --tunnel:#0E1220;
  --platform:#161C2E;
  --platform-2:#1E2540;
  --whitewash:#F0EFE9;
  --hush:#9298AC;
  --cab:#2447E6;
  --signal:#FFD300;
  --danger:#E32017;
  --ok:#00A166;
  --hairline:#2A3150;
  --radius:14px;
  --sans:'Gill Sans','Gill Sans MT','Trebuchet MS',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--tunnel);color:var(--whitewash);
  font-family:var(--sans);font-size:15px;
  display:flex;flex-direction:column;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit;color:inherit}

/* ---------- top bar ---------- */
header{
  flex:none;display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background:linear-gradient(180deg,rgba(14,18,32,.96),rgba(14,18,32,.82));
  border-bottom:1px solid var(--hairline);
  z-index:30;position:relative;
}
.wordmark{display:flex;align-items:center;gap:10px;user-select:none}
.wordmark svg{display:block}
.wordmark h1{font-size:17px;font-weight:600;letter-spacing:.06em}
.wordmark small{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--hush)}
#livePill{
  margin-left:auto;display:flex;align-items:center;gap:7px;
  font-size:11.5px;letter-spacing:.05em;color:var(--hush);
  padding:6px 11px;border:1px solid var(--hairline);border-radius:999px;
  background:var(--platform);
}
#livePill .dot{width:7px;height:7px;border-radius:50%;background:var(--hush)}
#livePill.on .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
#livePill.on{color:var(--whitewash)}
#livePill.warn .dot{background:var(--signal);box-shadow:0 0 8px var(--signal)}

/* ---------- layout ---------- */
main{flex:1;display:flex;min-height:0;position:relative}
#mapWrap{flex:1;position:relative;min-width:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.dragging{cursor:grabbing}
#zoomCtl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;border:1px solid var(--hairline);border-radius:10px;overflow:hidden;background:rgba(22,28,46,.9);backdrop-filter:blur(6px)}
#zoomCtl button{width:38px;height:38px;font-size:19px;line-height:1;color:var(--whitewash)}
#zoomCtl button:first-child{border-bottom:1px solid var(--hairline)}
#mapHint{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);
  font-size:12px;color:var(--hush);letter-spacing:.04em;
  background:rgba(14,18,32,.85);padding:6px 14px;border-radius:999px;border:1px solid var(--hairline);
  pointer-events:none;transition:opacity .5s;white-space:nowrap;
}

/* ---------- panel / bottom sheet ---------- */
#panel{
  width:390px;flex:none;display:flex;flex-direction:column;min-height:0;
  background:var(--platform);border-left:1px solid var(--hairline);z-index:20;
}
#sheetHandle{display:none}
#panelScroll{flex:1;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);scrollbar-width:thin}

.section-label{
  font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--hush);
  margin:20px 0 9px;display:flex;align-items:center;gap:8px;
}
.section-label::after{content:'';flex:1;height:1px;background:var(--hairline)}
.section-label:first-child{margin-top:2px}

/* search */
.stopField{position:relative;margin-bottom:8px}
.stopField input{
  width:100%;padding:12px 14px 12px 40px;font-size:15px;
  background:var(--platform-2);border:1px solid var(--hairline);border-radius:var(--radius);
  outline:none;
}
.stopField input:focus{border-color:var(--cab)}
.stopField input::placeholder{color:var(--hush)}
.stopField .pin{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;border-radius:50%;border:4px solid var(--cab);background:var(--tunnel);
}
.stopField.dest .pin{border-color:var(--danger)}
.suggest{
  position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;
  background:var(--platform-2);border:1px solid var(--hairline);border-radius:12px;
  max-height:230px;overflow-y:auto;box-shadow:0 12px 30px rgba(0,0,0,.5);display:none;
}
.suggest.open{display:block}
.suggest button{
  display:flex;width:100%;align-items:center;gap:9px;text-align:left;
  padding:10px 13px;font-size:14px;border-bottom:1px solid rgba(42,49,80,.5);
}
.suggest button:last-child{border-bottom:none}
.suggest button:hover,.suggest button.active{background:rgba(36,71,230,.18)}
.suggest .zone{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--hush)}
.lineDots{display:flex;gap:3px;flex:none}
.lineDots i{width:7px;height:7px;border-radius:50%;display:block}
#swapRow{display:flex;justify-content:center;margin:-2px 0 6px}
#swapBtn{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--hush);
  padding:5px 12px;border-radius:999px;border:1px solid var(--hairline);
}
#swapBtn:hover{color:var(--whitewash);border-color:var(--cab)}
#avoidRow{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--hush);margin-top:4px}
#avoidRow input{accent-color:var(--cab);width:15px;height:15px}

/* route diagram — the strip map */
#routeCard{margin-top:6px}
.summary{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:13px 15px;background:var(--platform-2);
  border:1px solid var(--hairline);border-radius:var(--radius);margin-bottom:14px;
}
.summary .big{font-size:29px;font-weight:600;font-variant-numeric:tabular-nums}
.summary .big small{font-size:14px;color:var(--hush);font-weight:400;margin-left:2px}
.summary .meta{font-size:12.5px;color:var(--hush)}
.strip{position:relative;padding-left:34px}
.leg{position:relative;padding-bottom:4px}
.leg .spine{
  position:absolute;left:-27px;top:10px;bottom:-10px;width:8px;border-radius:4px;
}
.leg:last-child .spine{bottom:14px}
.node{position:relative;padding:2px 0 2px 0}
.node .tick{
  position:absolute;left:-31px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;border-radius:50%;
  background:var(--whitewash);border:4px solid var(--tunnel);
}
.node.mid .tick{width:10px;height:10px;left:-28px;border-width:0;background:rgba(240,239,233,.85)}
.node .nm{font-size:14.5px}
.node.end .nm{font-weight:600;font-size:15.5px}
.node .sub{font-size:11.5px;color:var(--hush);margin-top:1px}
.midFold{
  font-size:11.5px;color:var(--hush);padding:3px 0 3px 0;cursor:pointer;user-select:none;
}
.midFold:hover{color:var(--whitewash)}
.legHead{
  display:flex;align-items:center;gap:8px;margin:7px 0 7px;flex-wrap:wrap;
}
.lineChip{
  font-size:11px;font-weight:600;letter-spacing:.05em;padding:4px 9px;border-radius:5px;
  color:#fff;
}
.legHead .dur{font-family:var(--mono);font-size:11px;color:var(--hush)}
.legWarn{
  display:flex;gap:8px;align-items:flex-start;margin:4px 0 8px;padding:8px 11px;
  background:rgba(255,211,0,.09);border:1px solid rgba(255,211,0,.35);border-radius:10px;
  font-size:12px;color:var(--signal);
}
.interchange{
  display:flex;align-items:center;gap:8px;margin:2px 0 2px;
  font-size:12px;color:var(--hush);
}
.interchange svg{flex:none}
#routeEmpty{
  padding:26px 18px;text-align:center;color:var(--hush);font-size:13.5px;line-height:1.55;
  border:1px dashed var(--hairline);border-radius:var(--radius);
}

/* line status */
.statusRow{
  border:1px solid var(--hairline);border-radius:12px;margin-bottom:7px;overflow:hidden;
  background:var(--platform-2);
}
.statusRow>button{
  display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;text-align:left;
}
.statusRow .bar{width:5px;align-self:stretch;border-radius:3px;flex:none}
.statusRow .ln{font-size:13.5px;flex:1}
.statusRow .st{font-size:11.5px;font-family:var(--mono);letter-spacing:.02em}
.st.good{color:var(--ok)}.st.minor{color:var(--signal)}.st.bad{color:var(--danger)}
.statusRow .why{
  display:none;padding:0 12px 11px 27px;font-size:12.5px;color:var(--hush);line-height:1.5;
}
.statusRow.open .why{display:block}
#statusNote{font-size:12px;color:var(--hush);line-height:1.55;margin-top:10px}
#statusList .skeleton{height:40px;border-radius:12px;background:linear-gradient(90deg,var(--platform-2),#232b4a,var(--platform-2));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:7px}
@keyframes sk{to{background-position:-200% 0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- mobile: bottom sheet ---------- */
@media (max-width:880px){
  main{flex-direction:column}
  #panel{
    position:absolute;left:0;right:0;bottom:0;width:auto;max-height:72%;height:46%;
    border-left:none;border-top:1px solid var(--hairline);
    border-radius:18px 18px 0 0;transition:height .25s ease;
    box-shadow:0 -14px 40px rgba(0,0,0,.5);
  }
  #panel.tall{height:72%}
  #sheetHandle{
    display:block;flex:none;padding:9px 0 5px;cursor:grab;
  }
  #sheetHandle::before{
    content:'';display:block;width:42px;height:4px;border-radius:2px;
    background:var(--hairline);margin:0 auto;
  }
  #zoomCtl{display:none}
}
</style>

      <div id="statusList"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
      <div id="statusNote"></div>

    </div>
  </aside>
</main>

/* ================= routing =================
   Node = station|line. Interchange penalty applied when switching lines
   at the same station. Live disruption inflates edge weights. */
const INTERCHANGE_MIN = 4;
function linePenalty(lineId){
  if (!document.getElementById('avoidChk').checked) return 1;
  const api = LINES[lineId].api;
  const s = lineStatus.get(api);
  if (!s) return 1;
  if (s.severity <= 5) return 12;     // suspended / closed / part closure — strongly avoid
  if (s.severity === 6) return 2.2;   // severe delays
  if (s.severity <= 9) return 1.35;   // reduced / minor
  return 1;
}
function route(fromId, toId){
  if (fromId===toId) return null;
  const adj = new Map(); // "st|line" -> [{to:"st|line", w, ride:{...}|null}]
  const add=(k,e)=>{ (adj.get(k)||adj.set(k,[]).get(k)).push(e); };
  for (const e of edges){
    const w = e.time * linePenalty(e.line);
    add(e.a+'|'+e.line, {to:e.b+'|'+e.line, w, ride:e});
    add(e.b+'|'+e.line, {to:e.a+'|'+e.line, w, ride:{...e,a:e.b,b:e.a}});
  }
  for (const st of stations.values()){
    const ls=[...st.lines];
    for (const l1 of ls) for (const l2 of ls) if (l1!==l2)
      add(st.id+'|'+l1, {to:st.id+'|'+l2, w:INTERCHANGE_MIN, ride:null});
  }
  // Dijkstra with simple binary heap
  const dist=new Map(), prev=new Map();
  const heap=[[0,null]]; // [d, key]
  for (const l of stations.get(fromId).lines){ dist.set(fromId+'|'+l,0); heap.push([0,fromId+'|'+l]); }
  const up=(i)=>{while(i>0){const p=(i-1)>>1;if(heap[p][0]<=heap[i][0])break;[heap[p],heap[i]]=[heap[i],heap[p]];i=p;}};
  const down=(i)=>{for(;;){let s=i,l=2*i+1,r=l+1;if(l<heap.length&&heap[l][0]<heap[s][0])s=l;if(r<heap.length&&heap[r][0]<heap[s][0])s=r;if(s===i)break;[heap[s],heap[i]]=[heap[i],heap[s]];i=s;}};
  heap.shift();heap.forEach((_,i)=>up(i));
  let best=null;
  while(heap.length){
    const [d,key]=heap[0];
    heap[0]=heap[heap.length-1];heap.pop();down(0);
    if(key===null||d>(dist.get(key)??Infinity))continue;
    const [sid]=key.split('|');
    if(+sid===toId){best=key;break;}
    for(const e of (adj.get(key)||[])){
      const nd=d+e.w;
      if(nd<(dist.get(e.to)??Infinity)){
        dist.set(e.to,nd);prev.set(e.to,{key,e});
        heap.push([nd,e.to]);up(heap.length-1);
      }
    }
  }
  if(!best)return null;
  // unwind into legs
  const steps=[];
  for(let k=best;prev.has(k);k=prev.get(k).key)steps.unshift(prev.get(k).e);
  const legs=[]; let realMin=0;
  for(const s of steps){
    if(!s.ride)continue;
    realMin+=s.ride.time;
    const last=legs[legs.length-1];
    if(last&&last.line===s.ride.line){last.stops.push(s.ride.b);last.min+=s.ride.time;}
    else legs.push({line:s.ride.line,stops:[s.ride.a,s.ride.b],min:s.ride.time});
  }
  realMin += (legs.length-1)*INTERCHANGE_MIN;
  return {legs,min:Math.round(realMin),changes:legs.length-1};
}

/* ================= map ================= */
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1;
// project lon/lat -> world units
const latC=51.51;
const P=s=>({x:s.lon*Math.cos(latC*Math.PI/180),y:-s.lat});
let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
for(const s of stations.values()){const p=P(s);minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);}
let cam={x:(minX+maxX)/2,y:(minY+maxY)/2,scale:1};
function fit(){
  const pad=0.9;
  cam.scale=Math.min(W/(maxX-minX),H/(maxY-minY))*pad;
  // start centred on zone 1
  cam.x=-0.12*Math.cos(latC*Math.PI/180);cam.y=-51.512;
  cam.scale*=3.2;
}
const toScr=p=>({x:(p.x-cam.x)*cam.scale+W/2,y:(p.y-cam.y)*cam.scale+H/2});
const toWorld=(x,y)=>({x:(x-W/2)/cam.scale+cam.x,y:(y-H/2)/cam.scale+cam.y});

// group parallel edges between the same station pair for offset drawing
const edgeGroups=new Map();
for(const e of edges){
  const k=Math.min(e.a,e.b)+'-'+Math.max(e.a,e.b);
  (edgeGroups.get(k)||edgeGroups.set(k,[]).get(k)).push(e);
}
let selFrom=null,selTo=null,activeRoute=null;

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  const zoomed=cam.scale>15000;
  const routeLines=new Set();
  const routeEdgeKeys=new Set();
  if(activeRoute)for(const leg of activeRoute.legs){
    routeLines.add(leg.line);
    for(let i=0;i<leg.stops.length-1;i++){
      const a=leg.stops[i],b=leg.stops[i+1];
      routeEdgeKeys.add(Math.min(a,b)+'-'+Math.max(a,b)+'|'+leg.line);
    }
  }
  const dim=!!activeRoute;
  // edges
  for(const [k,group] of edgeGroups){
    const [aId,bId]=k.split('-').map(Number);
    const A=toScr(P(stations.get(aId))),B=toScr(P(stations.get(bId)));
    if(Math.max(A.x,B.x)<-40||Math.min(A.x,B.x)>W+40||Math.max(A.y,B.y)<-40||Math.min(A.y,B.y)>H+40)continue;
    const dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1;
    const nx=-dy/len,ny=dx/len;
    const gap=Math.min(3.5,Math.max(2.2,cam.scale/9000));
    group.forEach((e,i)=>{
      const off=(i-(group.length-1)/2)*gap;
      const onRoute=routeEdgeKeys.has(k+'|'+e.line);
      ctx.strokeStyle=LINES[e.line].color;
      ctx.globalAlpha=dim?(onRoute?1:0.14):0.9;
      ctx.lineWidth=onRoute?4.5:2.4;
      ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(A.x+nx*off,A.y+ny*off);
      ctx.lineTo(B.x+nx*off,B.y+ny*off);
      ctx.stroke();
    });
  }
  ctx.globalAlpha=1;
  // stations
  const onRouteSt=new Set();
  if(activeRoute)for(const leg of activeRoute.legs)for(const s of leg.stops)onRouteSt.add(s);
  for(const s of stations.values()){
    const p=toScr(P(s));
    if(p.x<-20||p.x>W+20||p.y<-20||p.y>H+20)continue;
    const inter=s.lines.size>1;
    const hot=onRouteSt.has(s.id);
    ctx.globalAlpha=dim&&!hot?0.25:1;
    if(inter){
      ctx.fillStyle='#F0EFE9';ctx.beginPath();ctx.arc(p.x,p.y,hot?5:3.6,0,7);ctx.fill();
      ctx.fillStyle='#0E1220';ctx.beginPath();ctx.arc(p.x,p.y,hot?2.4:1.7,0,7);ctx.fill();
    }else{
      ctx.fillStyle='#F0EFE9';ctx.beginPath();ctx.arc(p.x,p.y,hot?3.4:2.2,0,7);ctx.fill();
    }
    if((zoomed||hot)&&(cam.scale>26000||inter||hot)){
      ctx.font='11px '+getComputedStyle(document.body).getPropertyValue('--sans');
      ctx.fillStyle='rgba(14,18,32,.85)';
      const w=ctx.measureText(s.name).width;
      ctx.fillRect(p.x+7,p.y-7,w+8,14);
      ctx.fillStyle=hot?'#FFFFFF':'rgba(240,239,233,.92)';
      ctx.fillText(s.name,p.x+11,p.y+3.5);
    }
  }
  ctx.globalAlpha=1;
  // origin / destination markers
  const mark=(id,color,label)=>{
    if(id==null)return;
    const p=toScr(P(stations.get(id)));
    ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x,p.y,9,0,7);ctx.fill();
    ctx.strokeStyle='#F0EFE9';ctx.lineWidth=2.5;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 10px '+getComputedStyle(document.body).getPropertyValue('--sans');
    ctx.textAlign='center';ctx.fillText(label,p.x,p.y+3.5);ctx.textAlign='left';
  };
  mark(selFrom,'#2447E6','A');mark(selTo,'#E32017','B');
}
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);

  W=r.width;H=r.height;

/* pan / zoom / tap */
let ptrs=new Map(),lastPinch=0,moved=false;
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  moved=false;canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){
    const dx=e.clientX-prev.x,dy=e.clientY-prev.y;
    if(Math.hypot(dx,dy)>2)moved=true;
    cam.x-=dx/cam.scale;cam.y-=dy/cam.scale;draw();
  }else if(ptrs.size===2){
    moved=true;
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(lastPinch){
      const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
      zoomAt(cx,cy,d/lastPinch);
    }
    lastPinch=d;
  }
});
canvas.addEventListener('pointerup',e=>{
  const r=canvas.getBoundingClientRect();
  if(!moved&&ptrs.size===1)tap(e.clientX-r.left,e.clientY-r.top);
  ptrs.delete(e.pointerId);lastPinch=0;canvas.classList.remove('dragging');
});
canvas.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);lastPinch=0;});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*0.0016));
},{passive:false});
function zoomAt(sx,sy,f){
  f=Math.max(0.2,Math.min(5,f));
  const before=toWorld(sx,sy);
  cam.scale=Math.max(2000,Math.min(260000,cam.scale*f));
  const after=toWorld(sx,sy);
  cam.x+=before.x-after.x;cam.y+=before.y-after.y;
  draw();
}
document.getElementById('zIn').onclick=()=>zoomAt(W/2,H/2,1.45);
document.getElementById('zOut').onclick=()=>zoomAt(W/2,H/2,1/1.45);

function tap(x,y){
  let best=null,bd=1e9;
  for(const s of stations.values()){
    const p=toScr(P(s));
    const d=Math.hypot(p.x-x,p.y-y);
    if(d<bd){bd=d;best=s;}
  }
  if(bd>22)return;
  if(selFrom==null||(selFrom!=null&&selTo!=null)){
    selFrom=best.id;selTo=null;
    document.getElementById('fromInput').value=best.name;
    document.getElementById('toInput').value='';
  }else{
    selTo=best.id;
    document.getElementById('toInput').value=best.name;
  }
  hint.style.opacity=0;
  update();
}

    sug.innerHTML='';
    for(const s of items){
      const b=document.createElement('button');
      const dots=[...s.lines].map(l=>`<i style="background:${LINES[l].color}"></i>`).join('');
      b.innerHTML=`<span class="lineDots">${dots}</span><span>${s.name}</span><span class="zone">Z${s.zone}</span>`;
      b.onclick=()=>{pick(s);};
      sug.appendChild(b);
    }
    sug.classList.toggle('open',items.length>0);
  }
  function pick(s){
    inp.value=s.name;sug.classList.remove('open');
    setter(s.id);hint.style.opacity=0;update();
    const p=P(s);cam.x=p.x;cam.y=p.y;cam.scale=Math.max(cam.scale,26000);draw();
  }
  inp.addEventListener('input',()=>render(inp.value));
  inp.addEventListener('focus',()=>{inp.select();render(inp.value);});
  inp.addEventListener('blur',()=>setTimeout(()=>sug.classList.remove('open'),160));
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){idx=Math.min(idx+1,items.length-1);}
    else if(e.key==='ArrowUp'){idx=Math.max(idx-1,0);}
    else if(e.key==='Enter'){if(items[Math.max(idx,0)])pick(items[Math.max(idx,0)]);return;}
    else return;
    e.preventDefault();
    [...sug.children].forEach((c,i)=>c.classList.toggle('active',i===idx));
  });
}
wire('fromInput','fromSuggest',id=>{selFrom=id;});
wire('toInput','toSuggest',id=>{selTo=id;});
document.getElementById('swapBtn').onclick=()=>{
  [selFrom,selTo]=[selTo,selFrom];
  const f=document.getElementById('fromInput'),t=document.getElementById('toInput');
  [f.value,t.value]=[t.value,f.value];
  update();
};
document.getElementById('avoidChk').onchange=update;

/* ================= route rendering ================= */
const routeOut=document.getElementById('routeOut'),routeEmpty=document.getElementById('routeEmpty');
function sevClass(sev){return sev>=10?'good':sev>=7?'minor':'bad';}
function update(){
  activeRoute=(selFrom!=null&&selTo!=null)?route(selFrom,selTo):null;
  draw();
  if(!activeRoute){routeOut.innerHTML='';routeEmpty.style.display='block';
    if(selFrom!=null&&selTo!=null)routeEmpty.textContent='No route found between those stations.';
    return;}
  routeEmpty.style.display='none';
  const r=activeRoute;
  let html=`<div class="summary">
    <span class="big">${r.min}<small>min</small></span>
    <span class="meta">${r.changes===0?'direct — no changes':r.changes+' change'+(r.changes>1?'s':'')}</span>
    <span class="meta">&middot; ${r.legs.reduce((n,l)=>n+l.stops.length-1,0)} stops</span>
  </div><div class="strip">`;
  r.legs.forEach((leg,li)=>{
    const L=LINES[leg.line];
    const s=lineStatus.get(L.api);
    const warn=s&&s.severity<10?s:null;
    html+=`<div class="leg"><span class="spine" style="background:${L.color}"></span>`;
    html+=`<div class="node end"><span class="tick"></span><div class="nm">${stations.get(leg.stops[0]).name}</div>`;
    if(li===0)html+=`<div class="sub">start here</div>`;
    html+=`</div>`;
    html+=`<div class="legHead"><span class="lineChip" style="background:${L.color};${leg.line==='3'?'color:#5a4a00;':''}${leg.line==='6'||leg.line==='12'?'color:#333;':''}">${L.name}</span><span class="dur">${leg.stops.length-1} stops &middot; ~${Math.round(leg.min)} min</span></div>`;
    if(warn)html+=`<div class="legWarn">&#9888; ${warn.desc}${warn.reason?' — '+warn.reason:''}</div>`;
    const mids=leg.stops.slice(1,-1);
    if(mids.length>0){
      if(mids.length<=4){
        for(const m of mids)html+=`<div class="node mid"><span class="tick"></span><div class="nm" style="font-size:12.5px;color:var(--hush)">${stations.get(m).name}</div></div>`;
      }else{
        html+=`<div class="midFold" data-leg="${li}">&#8942; ${mids.length} stops — show</div>
        <div class="mids" data-mids="${li}" style="display:none">`+
        mids.map(m=>`<div class="node mid"><span class="tick"></span><div class="nm" style="font-size:12.5px;color:var(--hush)">${stations.get(m).name}</div></div>`).join('')+`</div>`;
      }
    }
    const endName=stations.get(leg.stops[leg.stops.length-1]).name;
    if(li<r.legs.length-1){
      const next=LINES[r.legs[li+1].line];
      html+=`<div class="node end"><span class="tick"></span><div class="nm">${endName}</div>
        <div class="interchange"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M13 5l5 5-5 5M18 10H7a4 4 0 000 8h2"/></svg>change to ${next.name} &middot; allow ${INTERCHANGE_MIN} min</div></div>`;
    }else{
      html+=`<div class="node end"><span class="tick"></span><div class="nm">${endName}</div><div class="sub">arrive</div></div>`;
    }
    html+=`</div>`;
  });
  html+=`</div>`;
  routeOut.innerHTML=html;
  routeOut.querySelectorAll('.midFold').forEach(el=>{
    el.onclick=()=>{
      const box=routeOut.querySelector(`[data-mids="${el.dataset.leg}"]`);
      const open=box.style.display!=='none';
      box.style.display=open?'none':'block';
      el.innerHTML=open?`&#8942; ${box.children.length} stops — show`:`&#8942; hide stops`;
    };
  });
}

/* ================= live TfL status ================= */
const pill=document.getElementById('livePill'),liveTxt=document.getElementById('liveTxt');
const statusList=document.getElementById('statusList'),statusNote=document.getElementById('statusNote');
async function refreshStatus(){
  try{
    const res=await fetch('https://api.tfl.gov.uk/Line/Mode/tube,dlr/Status',{signal:AbortSignal.timeout(9000)});
    if(!res.ok)throw new Error(res.status);
    const arr=await res.json();
    lineStatus.clear();
    for(const l of arr){
      const st=(l.lineStatuses||[]).slice().sort((a,b)=>a.statusSeverity-b.statusSeverity)[0];
      if(!st)continue;
      lineStatus.set(l.id,{severity:st.statusSeverity,desc:st.statusSeverityDescription,reason:st.reason||''});
    }
    liveOk=true;
    const issues=[...lineStatus.values()].filter(s=>s.severity<10).length;
    pill.className=issues?'warn':'on';pill.classList.add(issues?'warn':'on');
    liveTxt.textContent=issues?issues+' line'+(issues>1?'s':'')+' disrupted':'All lines good';
    renderStatus();update();
  }catch(err){
    if(liveOk)return;              // keep last good data on transient failure
    liveOk=false;
    pill.className='';liveTxt.textContent='Offline data';
    statusList.innerHTML='';
    statusNote.innerHTML='Live status couldn&rsquo;t be fetched here. In the Claude preview, outside network calls are blocked &mdash; host this file (e.g. GitHub Pages) and it pulls live TfL line status automatically, no API key needed. Routes currently use timetable data only.';
    renderStatus(true);
  }
}
function renderStatus(offline){
  const order=Object.entries(LINES).sort((a,b)=>a[1].name.localeCompare(b[1].name));
  statusList.innerHTML='';
  for(const [id,L] of order){
    const s=lineStatus.get(L.api);
    const row=document.createElement('div');row.className='statusRow';
    const sev=s?s.severity:null;
    const cls=s?sevClass(sev):'';
    const label=s?s.desc:(offline?'—':'…');
    row.innerHTML=`<button>
      <span class="bar" style="background:${L.color}"></span>
      <span class="ln">${L.name}</span>
      <span class="st ${cls}">${label}</span>
    </button>${s&&s.reason?`<div class="why">${s.reason}</div>`:''}`;
    if(s&&s.reason)row.querySelector('button').onclick=()=>row.classList.toggle('open');
    statusList.appendChild(row);
  }
  if(liveOk)statusNote.textContent='Live from TfL — refreshes every minute. Disrupted lines are penalised or avoided when routing.';
}
